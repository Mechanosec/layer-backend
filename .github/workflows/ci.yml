name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # Deploy runs only after the pipeline has been proven against a real
      # Postgres (Testcontainers uses the runner's Docker daemon).
      - name: Integration tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:integration

  deploy:
    name: Deploy to grazuekomapp01
    # Manual-only: triggered via "Run workflow" by repo writers, on the branch
    # they pick in the dropdown — never for fork PRs.
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: [self-hosted, deploy]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Only for prisma migrate; the app itself is built inside the image.
      - run: pnpm install --frozen-lockfile
      - name: Build image
        run: docker build -t layer-backend:${{ github.sha }} -t layer-backend:latest .
      - name: Sync compose file and config to /opt/layer-backend
        run: rsync -a --delete --exclude .env ./ /opt/layer-backend/
      - name: Run database migrations
        run: |
          set -a; . /opt/layer-backend/.env; set +a
          npx prisma migrate deploy
      # One-time cutover from the native systemd services; a no-op afterwards.
      - name: Stop native services if still enabled
        run: sudo systemctl disable --now layer-backend layer-mock-ecom 2>/dev/null || true
      - name: Start containers
        working-directory: /opt/layer-backend
        run: TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then echo; echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "service did not become healthy"
          docker compose -f /opt/layer-backend/docker-compose.prod.yml logs --tail 50 app
          exit 1
