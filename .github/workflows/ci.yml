name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  build-on-server:
    name: Build on grazuekomapp01
    # Manual-only: triggered via "Run workflow" by repo writers, on the branch
    # they pick in the dropdown — never for fork PRs.
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: [self-hosted, deploy]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
